name: Track Official Scripts

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */8 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/track-official-scripts.yml"
      - "dev/download-official-scripts.ps1"

permissions:
  contents: write
  issues: write

concurrency:
  group: official-scripts
  cancel-in-progress: false

jobs:
  update:
    name: Track official scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download official scripts
        shell: pwsh
        run: ./dev/download-official-scripts.ps1

      - name: Update
        id: update
        shell: bash
        run: |
          set -euo pipefail

          scripts_dir="$(mktemp -d)"
          cp references/powershell.ps1 "$scripts_dir/powershell.ps1"
          cp references/unix.sh "$scripts_dir/unix.sh"

          if git fetch origin official-scripts:refs/remotes/origin/official-scripts; then
            git switch --create official-scripts --track origin/official-scripts
          else
            git switch --orphan official-scripts
            git rm --cached --ignore-unmatch -r .
          fi

          git clean -fdx
          cp "$scripts_dir/powershell.ps1" ./powershell.ps1
          cp "$scripts_dir/unix.sh" ./unix.sh
          git add --all

          if git diff --cached --quiet; then
            echo "Official install scripts are unchanged."
            exit 0
          fi

          diff_stat="$(git diff --cached --stat)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update official install scripts"
          git push origin official-scripts

          {
            echo "CHANGED=1"
            echo "COMMIT_SHA=$(git rev-parse HEAD)"
            echo "DIFF_STAT<<EOF"
            printf '%s\n' "$diff_stat"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open issue
        if: ${{ steps.update.outputs.CHANGED }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ steps.update.outputs.COMMIT_SHA }}
          DIFF_STAT: ${{ steps.update.outputs.DIFF_STAT }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          body_file="$(mktemp)"
          {
            echo "The official install scripts changed upstream. A new commit was pushed to the official-scripts branch."
            echo
            echo "- Commit: ${SERVER_URL}/${REPO}/commit/${COMMIT_SHA}"
            echo "- Workflow run: ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
            echo
            echo '```'
            echo "${DIFF_STAT}"
            echo '```'
          } > "$body_file"

          gh issue create \
            --repo "$REPO" \
            --title "Official install scripts updated (${COMMIT_SHA:0:7})" \
            --body-file "$body_file"
